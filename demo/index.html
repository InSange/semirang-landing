<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 네트워크를 쓰지 않습니다(D29). 바깥 연결(connect-src)을 모두 막고, 빌드한 이 폴더의 viewer.js와 viewer.css만 불러옵니다. 그림은 파일에서 만든 blob 주소로만 띄웁니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>회로도 결과 뷰어</title>
  <script defer src="viewer.js"></script>
  <link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="demo.css">
<script defer src="demo-data.js"></script>
<script defer src="demo.js"></script>
</head>

</body>
</html>
